name: Collect Wait Times

# Dispatched every 30 minutes by cron-job.org. Keep it dispatch-only: GitHub
# disables `schedule:` workflows in public repos after 60 days without repo
# activity, and dispatches don't count as activity. tests/test_workflows.py
# fails if a schedule is added here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: Run collect pipeline
        working-directory: ml-service
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collect.py

  # GitHub disables scheduled workflows after 60 days of repo inactivity.
  # Re-enabling them every 30 minutes caps any gap at one collect interval.
  keep-schedules-enabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      # Every workflow with a `schedule:` trigger. tests/test_workflows.py
      # fails when this list and the workflow files disagree.
      SCHEDULED_WORKFLOWS: archive.yml freshness.yml sync-date-context.yml train.yml
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -ra workflows <<< "$SCHEDULED_WORKFLOWS"
          for workflow in "${workflows[@]}"; do
            gh workflow enable "$workflow" --repo "$GITHUB_REPOSITORY"
          done
