name: Sync Date Context

on:
  schedule:
    # Adjustments expire after seven days. Avoid :00, when GitHub may delay
    # scheduled workflows during busy periods.
    - cron: "17 10 * * 0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call sync-date-context endpoint
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/sync-date-context"
