name: Forecast Freshness

on:
  schedule:
    # Run well after the 06:17 UTC train. Avoid :00, when GitHub's scheduler
    # is busiest, and keep this alert separate from successful collection.
    - cron: "47 13 * * *"
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: Check forecast freshness
        working-directory: ml-service
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python check_freshness.py --force
