name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Both are read at module load: lib/db.ts throws without DATABASE_URL, and
      # the build imports every route. Neither job ever opens a connection —
      # tests mock Prisma and no page fetches at build time.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      CRON_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx jest --coverage --ci

      - name: Build
        run: npm run build

  ml:
    name: ML service — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: ml-service
        run: python -m pytest -q

  ml-integration:
    name: ML service — integration tests on Postgres 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: disney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/disney_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/disney_test
      # Fail instead of skipping if TEST_DATABASE_URL ever goes missing here.
      REQUIRE_INTEGRATION_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # The same path production takes. A migration that only works on a
      # database built by `db push` fails here.
      - name: Apply Prisma migrations to an empty database
        run: npx prisma migrate deploy

      - name: Migrations produce exactly schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        working-directory: ml-service
        run: python -m pytest -q -m integration
