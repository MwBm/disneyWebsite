name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Both are read at module load: lib/db.ts throws without DATABASE_URL, and
      # the build imports every route. Neither job ever opens a connection —
      # tests mock Prisma and no page fetches at build time.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      CRON_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx jest --coverage --ci

      - name: Build
        run: npm run build

  ml:
    name: ML service — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ml-service
        run: python -m pytest -q
